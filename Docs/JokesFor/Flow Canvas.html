<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>JokesFor — Flow Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  html,body{margin:0;padding:0;background:#0E0D11;font-family:"Plus Jakarta Sans",system-ui,sans-serif;color:#fff;height:100%}
  iframe{border:0;display:block;width:100%;height:100%;background:#FBFAF7}
  .ab-shell{width:100%;height:100%;background:#FBFAF7;border-radius:16px;overflow:hidden;position:relative}
</style>
</head>
<body>
<div id="canvas-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel">
const SCREENS = [
  { id:"login",    label:"01 · Login",                w:1440, h:900 },
  { id:"register", label:"02 · Register",             w:1440, h:900 },
  { id:"onb1",     label:"03 · Onboarding · Vibes",   w:1440, h:900 },
  { id:"onb2",     label:"04 · Onboarding · Formats", w:1440, h:900 },
  { id:"onb3",     label:"05 · Onboarding · Ritual",  w:1440, h:900 },
  { id:"today",    label:"06 · Today",                w:1440, h:3000 },
  { id:"explore",  label:"07 · Explore",              w:1440, h:1900 },
  { id:"search",   label:"08 · Search",               w:1440, h:1500 },
];

function Frame({ id }) {
  return <iframe src={`Flow.html#${id}`} title={id} loading="lazy" scrolling="no"/>;
}

function App() {
  return (
    <DesignCanvas title="JokesFor · Flow" subtitle="Login → Register → Onboarding → Today → Explore → Search · click any artboard to focus">
      <DCSection id="auth" title="Authentication">
        {SCREENS.slice(0,2).map(s => (
          <DCArtboard key={s.id} id={s.id} label={s.label} width={s.w} height={s.h}>
            <Frame id={s.id}/>
          </DCArtboard>
        ))}
      </DCSection>
      <DCSection id="onb" title="Onboarding · 3 steps">
        {SCREENS.slice(2,5).map(s => (
          <DCArtboard key={s.id} id={s.id} label={s.label} width={s.w} height={s.h}>
            <Frame id={s.id}/>
          </DCArtboard>
        ))}
      </DCSection>
      <DCSection id="app" title="Daily product">
        {SCREENS.slice(5).map(s => (
          <DCArtboard key={s.id} id={s.id} label={s.label} width={s.w} height={s.h}>
            <Frame id={s.id}/>
          </DCArtboard>
        ))}
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById("canvas-root")).render(<App/>);
</script>
</body>
</html>
