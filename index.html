<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Logos/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6A1CF6" />

    <title>Jokes For — Find the right joke. For any moment.</title>
    <meta
      name="description"
      content="Discover hand-picked jokes every morning — setups, one-liners, stories and more. Reveal the punchline, save your favorites, and follow real comedians."
    />

    <!-- Open Graph / Twitter defaults — the fallback for any route a scraper
         hits before JS runs. Per-route <Seo> (src/lib/seo/Seo.tsx) overrides
         these for JS-capable crawlers once the app mounts. -->
    <meta property="og:site_name" content="JokesFor" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Jokes For — Find the right joke. For any moment." />
    <meta
      property="og:description"
      content="Discover hand-picked jokes every morning — setups, one-liners, stories and more. Reveal the punchline, save your favorites, and follow real comedians."
    />
    <meta property="og:image" content="https://jokesforfront.web.app/Logos/banner_purple.svg" />
    <meta property="og:url" content="https://jokesforfront.web.app/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jokes For — Find the right joke. For any moment." />
    <meta
      name="twitter:description"
      content="Discover hand-picked jokes every morning — setups, one-liners, stories and more. Reveal the punchline, save your favorites, and follow real comedians."
    />
    <meta name="twitter:image" content="https://jokesforfront.web.app/Logos/banner_purple.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,800;1,900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,600;1,9..144,700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
