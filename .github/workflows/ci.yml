name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
        env:
          VITE_API_URL: https://jokesforbackend-332865216810.us-east1.run.app/api/v1
          VITE_USE_MOCKS: 'false'
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder
          VITE_FIREBASE_APP_ID: ci-placeholder
          VITE_GOOGLE_CLIENT_ID: ci-placeholder
          VITE_GOOGLE_OAUTH_REDIRECT_URI: https://jokesforfront.web.app/auth/google/callback
          VITE_USE_REAL_PREFERENCES: 'true'
          VITE_USE_REAL_CREATE: 'true'
